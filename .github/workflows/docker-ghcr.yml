name: Build and publish Docker image (GHCR)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      components_angular_version:
        description: "openvidu-components-angular version for CI/Docker"
        required: false
        default: "3.6.1"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/danyal-903/openvidu-meet

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      COMPONENTS_ANGULAR_VERSION: ${{ github.event.inputs.components_angular_version || '3.6.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare CI build dependencies
        run: ./scripts/prepare-ci-build.sh --components-angular-version "${COMPONENTS_ANGULAR_VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: meet-ce/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_HREF=/meet/
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Restore dev config (cleanup)
        if: always()
        run: ./scripts/restore-dev-config.sh
